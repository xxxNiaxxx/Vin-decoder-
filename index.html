<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VIN Year Decoder</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.0.4/tesseract.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0d0d0d;
    --surface: #161616;
    --border: #2a2a2a;
    --accent: #e8c96d;
    --accent2: #c4a24e;
    --text: #f0ede8;
    --muted: #6b6b6b;
    --success: #4ecb71;
    --error: #e8605a;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
  }

  header {
    width: 100%;
    padding: 28px 24px 16px;
    text-align: center;
    border-bottom: 1px solid var(--border);
  }

  header h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2.8rem;
    letter-spacing: 0.12em;
    color: var(--accent);
    line-height: 1;
  }

  header p {
    color: var(--muted);
    font-size: 0.78rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-top: 6px;
  }

  .main {
    width: 100%;
    max-width: 480px;
    padding: 24px 20px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .camera-box {
    position: relative;
    width: 100%;
    aspect-ratio: 4/3;
    background: #000;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid var(--border);
  }

  #videoEl {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  #canvasEl { display: none; }

  .vin-guide {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }

  .guide-box {
    width: 88%;
    height: 52px;
    border: 2px solid var(--accent);
    border-radius: 6px;
    box-shadow: 0 0 0 2000px rgba(0,0,0,0.45);
    position: relative;
  }

  .guide-label {
    position: absolute;
    top: -26px;
    left: 0; right: 0;
    text-align: center;
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.12em;
    color: var(--accent);
    text-transform: uppercase;
  }

  .cam-controls { display: flex; gap: 10px; }

  .btn {
    flex: 1;
    padding: 14px;
    border: none;
    border-radius: 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.88rem;
    font-weight: 500;
    cursor: pointer;
    letter-spacing: 0.04em;
    transition: all 0.15s;
  }

  .btn-primary { background: var(--accent); color: #000; }
  .btn-primary:hover { background: var(--accent2); }
  .btn-secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
  .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .upload-alt {
    text-align: center;
    color: var(--muted);
    font-size: 0.78rem;
  }

  .upload-alt label {
    color: var(--accent);
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  #fileInput { display: none; }

  #previewImg {
    width: 100%;
    border-radius: 12px;
    display: none;
    border: 1px solid var(--border);
  }

  .retake-bar { display: none; gap: 10px; }
  .retake-bar.show { display: flex; }

  .status {
    text-align: center;
    font-size: 0.82rem;
    color: var(--muted);
    min-height: 22px;
    line-height: 1.5;
  }

  .result-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px;
    display: none;
    animation: slideUp 0.3s ease;
  }

  .result-card.show { display: block; }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .result-label {
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
  }

  .result-char {
    display: flex;
    align-items: baseline;
    gap: 14px;
    margin-bottom: 18px;
  }

  .char-display {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 5rem;
    color: var(--accent);
    line-height: 1;
  }

  .char-sublabel { color: var(--muted); font-size: 0.78rem; line-height: 1.5; }
  .char-sublabel strong { display: block; color: var(--text); font-size: 0.9rem; }

  .year-display {
    background: linear-gradient(135deg, #1e1a0e, #191500);
    border: 1px solid var(--accent2);
    border-radius: 10px;
    padding: 18px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .year-num {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 3.5rem;
    color: var(--accent);
    letter-spacing: 0.06em;
    line-height: 1;
  }

  .year-icon { font-size: 2.5rem; opacity: 0.6; }

  .full-vin {
    margin-top: 14px;
    padding: 10px 14px;
    background: #0a0a0a;
    border-radius: 8px;
    font-family: 'DM Mono', monospace;
    font-size: 0.82rem;
    color: var(--muted);
    letter-spacing: 0.12em;
    word-break: break-all;
    line-height: 1.8;
  }

  .full-vin .hl { color: var(--accent); font-weight: bold; font-size: 1rem; }

  .error-msg { color: var(--error); font-size: 0.85rem; line-height: 1.6; }
  .note-msg { font-size: 0.72rem; color: var(--muted); margin-top: 10px; line-height: 1.5; }

  /* Manual input fallback */
  .manual-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .manual-box label {
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .manual-row { display: flex; gap: 8px; }

  .manual-box input {
    flex: 1;
    background: #0a0a0a;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 12px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 1rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    outline: none;
  }

  .manual-box input:focus { border-color: var(--accent); }

  .spinner {
    display: inline-block;
    width: 16px; height: 16px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .badge-free {
    display: inline-block;
    background: #1a2e1a;
    color: var(--success);
    border: 1px solid #2a4a2a;
    border-radius: 20px;
    padding: 2px 10px;
    font-size: 0.68rem;
    letter-spacing: 0.1em;
    font-family: 'DM Mono', monospace;
    margin-left: 8px;
    vertical-align: middle;
  }
</style>
</head>
<body>

<header>
  <h1>VIN Decoder <span class="badge-free">FREE</span></h1>
  <p>No API key · Works offline · 100% on-device</p>
</header>

<div class="main">

  <!-- Camera -->
  <div class="camera-box" id="cameraBox">
    <video id="videoEl" autoplay playsinline muted></video>
    <canvas id="canvasEl"></canvas>
    <div class="vin-guide">
      <div class="guide-box">
        <div class="guide-label">Align VIN number inside box</div>
      </div>
    </div>
  </div>

  <img id="previewImg" alt="Captured VIN">

  <!-- Camera controls -->
  <div class="cam-controls" id="camControls">
    <button class="btn btn-secondary" id="startCamBtn" onclick="startCamera()">📷 Open Camera</button>
    <button class="btn btn-primary" id="captureBtn" onclick="capture()" disabled>Snap</button>
  </div>

  <div class="retake-bar" id="retakeBar">
    <button class="btn btn-secondary" onclick="retake()">↩ Retake</button>
    <button class="btn btn-primary" onclick="analyzeOCR()">🔍 Read VIN</button>
  </div>

  <div class="upload-alt">
    or <label for="fileInput">upload a photo</label>
    <input type="file" id="fileInput" accept="image/*" onchange="handleFile(event)">
  </div>

  <div class="status" id="status"></div>

  <!-- Result -->
  <div class="result-card" id="resultCard">
    <div class="result-label">Analysis Result</div>
    <div id="resultContent"></div>
  </div>

  <!-- Manual fallback -->
  <div class="manual-box">
    <label>⌨️ Ή γράψε το VIN χειροκίνητα</label>
    <div class="manual-row">
      <input type="text" id="manualVin" maxlength="17" placeholder="WAUZZZ8DZWA163120" oninput="this.value=this.value.toUpperCase()">
      <button class="btn btn-primary" style="flex:0;padding:10px 16px" onclick="decodeManual()">GO</button>
    </div>
  </div>

</div>

<script>
// ── VIN Year Table (dual cycle) ───────────────────────────────────
const VIN_YEARS = {
  'A':[1980,2010],'B':[1981,2011],'C':[1982,2012],'D':[1983,2013],
  'E':[1984,2014],'F':[1985,2015],'G':[1986,2016],'H':[1987,2017],
  'J':[1988,2018],'K':[1989,2019],'L':[1990,2020],'M':[1991,2021],
  'N':[1992,2022],'P':[1993,2023],'R':[1994,2024],'S':[1995,2025],
  'T':[1996,2026],'V':[1997,2027],'W':[1998,2028],'X':[1999,2029],
  'Y':[2000,null],'1':[2001,null],'2':[2002,null],'3':[2003,null],
  '4':[2004,null],'5':[2005,null],'6':[2006,null],'7':[2007,null],
  '8':[2008,null],'9':[2009,null]
};

// ── State ─────────────────────────────────────────────────────────
let stream = null;
let capturedDataUrl = null;

// ── Camera ────────────────────────────────────────────────────────
async function startCamera() {
  try {
    setStatus('<span class="spinner"></span> Starting camera…');
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1920 } }
    });
    document.getElementById('videoEl').srcObject = stream;
    document.getElementById('captureBtn').disabled = false;
    document.getElementById('startCamBtn').disabled = true;
    setStatus('Camera ready — align VIN in the frame');
  } catch(e) {
    setStatus('Camera unavailable — upload a photo or type manually below');
  }
}

function capture() {
  const video = document.getElementById('videoEl');
  const canvas = document.getElementById('canvasEl');
  // Save camera box screen size BEFORE hiding it
  const camBox = document.getElementById('cameraBox');
  window._camBoxW = camBox.clientWidth;
  window._camBoxH = camBox.clientHeight;
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0);
  capturedDataUrl = canvas.toDataURL('image/jpeg', 0.95);
  showPreview(capturedDataUrl);
  stopCamera();
}

function stopCamera() {
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  document.getElementById('cameraBox').style.display = 'none';
  document.getElementById('camControls').style.display = 'none';
}

function retake() {
  document.getElementById('previewImg').style.display = 'none';
  document.getElementById('retakeBar').classList.remove('show');
  document.getElementById('cameraBox').style.display = 'block';
  document.getElementById('camControls').style.display = 'flex';
  document.getElementById('startCamBtn').disabled = false;
  document.getElementById('captureBtn').disabled = true;
  document.getElementById('resultCard').classList.remove('show');
  capturedDataUrl = null;
  setStatus('');
}

function showPreview(dataUrl) {
  const img = document.getElementById('previewImg');
  img.src = dataUrl;
  img.style.display = 'block';
  document.getElementById('retakeBar').classList.add('show');
  setStatus('Photo ready — tap Read VIN');
}

function handleFile(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    capturedDataUrl = ev.target.result;
    stopCamera();
    showPreview(capturedDataUrl);
  };
  reader.readAsDataURL(file);
}

// ── OCR with Tesseract ────────────────────────────────────────────
async function analyzeOCR() {
  if (!capturedDataUrl) return;

  setStatus('<span class="spinner"></span> Loading OCR engine…');
  showResult('<span class="spinner"></span> Reading VIN from image…', true);

  try {
    const img = new Image();
    img.src = capturedDataUrl;
    await new Promise(r => img.onload = r);

    // ── Crop to match the guide box exactly ──────────────────────
    // Guide box CSS: width=88% of camera-box, height=52px
    // Camera-box aspect-ratio: 4/3
    // We replicate those proportions on the actual image pixels.
    const camBox = document.getElementById('cameraBox');
    // Use saved size from snap time (box is hidden after capture)
    const camW = window._camBoxW || camBox.clientWidth || 360;
    const camH = window._camBoxH || camBox.clientHeight || 270;

    // Guide box screen dimensions
    const guideW = camW * 0.88;
    const guideH = 52; // px (matches CSS)
    const guideX = (camW - guideW) / 2;
    const guideY = (camH - guideH) / 2;

    // Map screen coords → image coords
    const scaleX = img.width / camW;
    const scaleY = img.height / camH;

    // Add generous vertical padding so text isn't clipped
    const padY = guideH * 0.6;
    const cropX = guideX * scaleX;
    const cropY = Math.max(0, (guideY - padY) * scaleY);
    const cropW = guideW * scaleX;
    const cropH = Math.min(img.height - cropY, (guideH + padY * 2) * scaleY);

    // Draw ONLY the cropped strip, scaled up 4× for OCR accuracy
    const scale = 4;
    const canvas = document.createElement('canvas');
    canvas.width = cropW * scale;
    canvas.height = cropH * scale;
    const ctx = canvas.getContext('2d');

    ctx.drawImage(img, cropX, cropY, cropW, cropH, 0, 0, canvas.width, canvas.height);

    // B&W threshold for cleaner OCR
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const data = imageData.data;
    for (let i = 0; i < data.length; i += 4) {
      const avg = (data[i] + data[i+1] + data[i+2]) / 3;
      const v = avg > 140 ? 255 : 0;
      data[i] = data[i+1] = data[i+2] = v;
    }
    ctx.putImageData(imageData, 0, 0);

    const processedUrl = canvas.toDataURL('image/png');

    setStatus('<span class="spinner"></span> Running OCR…');

    const result = await Tesseract.recognize(processedUrl, 'eng', {
      tessedit_char_whitelist: 'ABCDEFGHJKLMNPRSTUVWXYZ0123456789',
    });

    const rawText = result.data.text;
    const vin = extractVIN(rawText);

    setStatus('');

    if (vin) {
      displayResult(vin);
    } else {
      // Show raw text to help user
      showResult(`
        <div class="error-msg">⚠️ Δεν βρέθηκε VIN στην εικόνα.<br><br>
        Κείμενο που διάβασα:<br>
        <span style="font-family:'DM Mono',monospace;font-size:0.75rem;color:var(--muted)">${rawText.trim().slice(0,200) || '(τίποτα)'}</span>
        </div>
        <div class="note-msg">💡 Δοκίμασε πιο κοντινή φωτογραφία, ή γράψε το VIN χειροκίνητα παρακάτω.</div>
      `, false);
    }

  } catch(err) {
    setStatus('');
    showResult(`<div class="error-msg">⚠️ OCR σφάλμα: ${err.message}</div>`, false);
  }
}

function extractVIN(text) {
  // Clean text: remove spaces/newlines, uppercase
  const clean = text.replace(/[^A-HJ-NPR-Z0-9]/gi, '').toUpperCase();

  // Look for 17-char sequence (VIN pattern — no I, O, Q)
  const match = clean.match(/[A-HJ-NPR-Z0-9]{17}/);
  if (match) return match[0];

  // Fallback: find longest alphanumeric sequence ≥ 11 chars
  const parts = text.toUpperCase().replace(/[^A-HJ-NPR-Z0-9]/g, ' ').split(/\s+/).filter(p => p.length >= 11);
  if (parts.length) return parts.sort((a,b) => b.length - a.length)[0];

  return null;
}

// ── Manual decode ─────────────────────────────────────────────────
function decodeManual() {
  const val = document.getElementById('manualVin').value.trim().toUpperCase().replace(/[^A-HJ-NPR-Z0-9]/g, '');
  if (val.length < 10) {
    setStatus('Βάλε τουλάχιστον 10 χαρακτήρες');
    return;
  }
  setStatus('');
  displayResult(val);
}

// ── Display result ────────────────────────────────────────────────
function displayResult(vin) {
  const ch = vin[9]; // 10th character (index 9)
  const years = VIN_YEARS[ch];

  let yearHTML = '';
  if (years) {
    const [y1, y2] = years;
    yearHTML = `
      <div class="year-display">
        <div>
          <div style="font-size:0.7rem;color:var(--muted);margin-bottom:4px;letter-spacing:0.1em">MODEL YEAR</div>
          <div class="year-num">${y1}</div>
        </div>
        <div class="year-icon">🚗</div>
      </div>
      ${y2 ? `
      <div class="year-display">
        <div>
          <div style="font-size:0.7rem;color:var(--muted);margin-bottom:4px;letter-spacing:0.1em">Ή MODEL YEAR</div>
          <div class="year-num">${y2}</div>
        </div>
        <div class="year-icon">🚘</div>
      </div>
      <div class="note-msg">ℹ️ Ο κωδικός επαναλαμβάνεται κάθε 30 χρόνια. Έλεγξε και άλλα στοιχεία για επιβεβαίωση.</div>` : ''}
    `;
  } else {
    yearHTML = `<div class="error-msg">Ο χαρακτήρας "${ch}" δεν υπάρχει στον πίνακα VIN.</div>`;
  }

  // Highlight 10th char in VIN display
  const vinDisplay = vin.length >= 10
    ? vin.slice(0,9) + `<span class="hl">${vin[9]}</span>` + vin.slice(10)
    : vin;

  showResult(`
    <div class="result-char">
      <div class="char-display">${ch}</div>
      <div class="char-sublabel">
        <strong>10ος χαρακτήρας VIN</strong>
        Κωδικός έτους κατασκευής
      </div>
    </div>
    ${yearHTML}
    <div class="full-vin">VIN: ${vinDisplay}</div>
  `, false);
}

function showResult(html, loading) {
  const card = document.getElementById('resultCard');
  document.getElementById('resultContent').innerHTML = html;
  card.classList.add('show');
  card.style.opacity = loading ? '0.7' : '1';
}

function setStatus(html) {
  document.getElementById('status').innerHTML = html;
}

// Enter key on manual input
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('manualVin').addEventListener('keydown', e => {
    if (e.key === 'Enter') decodeManual();
  });
});
</script>
</body>
</html>
