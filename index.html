<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VIN Decoder</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.0.4/tesseract.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --bg:#0d0d0d; --surface:#161616; --border:#2a2a2a;
    --gold:#e8c96d; --gold2:#c4a24e; --text:#f0ede8;
    --muted:#6b6b6b; --err:#e8605a;
  }
  body { background:var(--bg); color:var(--text); font-family:'DM Sans',sans-serif; min-height:100vh; display:flex; flex-direction:column; align-items:center; }
  header { width:100%; padding:20px 20px 12px; text-align:center; border-bottom:1px solid var(--border); }
  header h1 { font-family:'Bebas Neue',sans-serif; font-size:2.4rem; letter-spacing:.12em; color:var(--gold); }
  header p  { color:var(--muted); font-size:.7rem; letter-spacing:.1em; text-transform:uppercase; margin-top:4px; }
  .main { width:100%; max-width:480px; padding:18px 16px; display:flex; flex-direction:column; gap:14px; }

  /* ── viewfinder strip ── */
  .vf-label { font-family:'DM Mono',monospace; font-size:.6rem; letter-spacing:.16em; text-transform:uppercase; color:var(--gold); text-align:center; }

  .viewfinder {
    position:relative; width:100%; height:70px;
    background:#000; border-radius:8px; overflow:hidden;
    border:2px solid var(--gold);
    box-shadow:0 0 18px rgba(232,201,109,.18);
  }
  /* corner marks */
  .viewfinder::before,.viewfinder::after {
    content:''; position:absolute; width:14px; height:14px;
    border-color:var(--gold); border-style:solid; z-index:3; pointer-events:none;
  }
  .viewfinder::before { top:4px; left:4px; border-width:2px 0 0 2px; }
  .viewfinder::after  { bottom:4px; right:4px; border-width:0 2px 2px 0; }

  #video {
    position:absolute; inset:0; width:100%; height:100%;
    object-fit:cover;
    /* zoom 2× so only the center strip of the scene is visible */
    transform:scale(2); transform-origin:center center;
  }

  /* ── preview of what was cropped ── */
  #preview {
    display:none; width:100%; height:70px;
    object-fit:cover; border-radius:8px;
    border:2px solid var(--gold2);
    background:#000;
  }

  canvas { display:none; }

  /* ── buttons ── */
  .row { display:flex; gap:10px; }
  .btn {
    flex:1; padding:13px; border:none; border-radius:10px;
    font-family:'DM Sans',sans-serif; font-size:.88rem; font-weight:500;
    cursor:pointer; transition:all .13s;
  }
  .btn-p { background:var(--gold); color:#000; }
  .btn-s { background:var(--surface); color:var(--text); border:1px solid var(--border); }
  .btn:active { transform:scale(.96); }
  .btn:disabled { opacity:.35; cursor:not-allowed; transform:none; }
  #retakeRow { display:none; }
  #retakeRow.show { display:flex; }

  .upload { text-align:center; color:var(--muted); font-size:.76rem; }
  .upload label { color:var(--gold); cursor:pointer; text-decoration:underline; text-underline-offset:3px; }
  input[type=file] { display:none; }

  .status { text-align:center; font-size:.8rem; color:var(--muted); min-height:20px; }

  /* ── result ── */
  .card { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:20px; display:none; }
  .card.show { display:block; animation:up .25s ease; }
  @keyframes up { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
  .card-label { font-family:'DM Mono',monospace; font-size:.6rem; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); margin-bottom:12px; }

  .big-char { display:flex; align-items:baseline; gap:12px; margin-bottom:14px; }
  .char { font-family:'Bebas Neue',sans-serif; font-size:5rem; color:var(--gold); line-height:1; }
  .char-info { font-size:.76rem; color:var(--muted); line-height:1.6; }
  .char-info strong { display:block; color:var(--text); font-size:.86rem; }

  .year-box {
    background:linear-gradient(135deg,#1e1a0e,#191500);
    border:1px solid var(--gold2); border-radius:10px;
    padding:14px 18px; display:flex; align-items:center;
    justify-content:space-between; margin-bottom:8px;
  }
  .year-sub { font-size:.64rem; color:var(--muted); letter-spacing:.1em; margin-bottom:2px; }
  .year-num { font-family:'Bebas Neue',sans-serif; font-size:3rem; color:var(--gold); line-height:1; }

  .vin-strip {
    margin-top:12px; padding:10px 12px; background:#0a0a0a;
    border-radius:8px; font-family:'DM Mono',monospace; font-size:.78rem;
    color:var(--muted); letter-spacing:.14em; word-break:break-all; line-height:2;
  }
  .hl { color:var(--gold); font-weight:bold; font-size:1rem; }
  .err  { color:var(--err); font-size:.84rem; line-height:1.6; }
  .note { font-size:.7rem; color:var(--muted); margin-top:8px; line-height:1.5; }

  /* manual */
  .manual { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:14px 16px; display:flex; flex-direction:column; gap:8px; }
  .manual label { font-family:'DM Mono',monospace; font-size:.6rem; letter-spacing:.15em; text-transform:uppercase; color:var(--muted); }
  .manual .row2 { display:flex; gap:8px; }
  .manual input {
    flex:1; background:#0a0a0a; border:1px solid var(--border); border-radius:6px;
    padding:10px 12px; color:var(--text); font-family:'DM Mono',monospace;
    font-size:1rem; letter-spacing:.15em; text-transform:uppercase; outline:none;
  }
  .manual input:focus { border-color:var(--gold); }

  .spinner { display:inline-block; width:14px; height:14px; border:2px solid var(--border); border-top-color:var(--gold); border-radius:50%; animation:spin .7s linear infinite; vertical-align:middle; margin-right:5px; }
  @keyframes spin { to{transform:rotate(360deg)} }
</style>
</head>
<body>

<header>
  <h1>VIN Decoder</h1>
  <p>Fit VIN in the strip · Snap · Get year</p>
</header>

<div class="main">

  <div class="vf-label" id="vfLabel">▸ Center the VIN number in the strip below</div>

  <!-- The viewfinder strip -->
  <div class="viewfinder" id="viewfinder">
    <video id="video" autoplay playsinline muted></video>
  </div>

  <!-- Preview of cropped strip (shown after snap) -->
  <img id="preview" alt="VIN strip">

  <canvas id="canvas"></canvas>

  <!-- Camera controls -->
  <div class="row" id="camRow">
    <button class="btn btn-s" id="openBtn" onclick="openCamera()">📷 Open Camera</button>
    <button class="btn btn-p" id="snapBtn" onclick="snap()" disabled>Snap</button>
  </div>

  <!-- After snap -->
  <div class="row" id="retakeRow">
    <button class="btn btn-s" onclick="retake()">↩ Retake</button>
    <button class="btn btn-p" onclick="readVIN()">🔍 Read VIN</button>
  </div>

  <div class="upload">
    or <label for="fileInput">upload photo of VIN</label>
    <input type="file" id="fileInput" accept="image/*" onchange="fromFile(event)">
  </div>

  <div class="status" id="status"></div>

  <!-- Result card -->
  <div class="card" id="resultCard">
    <div class="card-label">Result</div>
    <div id="resultBody"></div>
  </div>

  <!-- Manual input -->
  <div class="manual">
    <label>⌨️ Or type VIN manually</label>
    <div class="row2">
      <input id="manualInput" maxlength="17" placeholder="17 characters…"
             oninput="this.value=this.value.toUpperCase().replace(/[^A-HJ-NPR-Z0-9]/g,'')">
      <button class="btn btn-p" style="flex:0;padding:10px 18px" onclick="manualDecode()">GO</button>
    </div>
  </div>

</div>

<script>
// ── VIN year table ───────────────────────────────────────────────
const YEARS = {
  A:[1980,2010],B:[1981,2011],C:[1982,2012],D:[1983,2013],
  E:[1984,2014],F:[1985,2015],G:[1986,2016],H:[1987,2017],
  J:[1988,2018],K:[1989,2019],L:[1990,2020],M:[1991,2021],
  N:[1992,2022],P:[1993,2023],R:[1994,2024],S:[1995,2025],
  T:[1996,2026],V:[1997,2027],W:[1998,2028],X:[1999,2029],
  Y:[2000,null],1:[2001,null],2:[2002,null],3:[2003,null],
  4:[2004,null],5:[2005,null],6:[2006,null],7:[2007,null],
  8:[2008,null],9:[2009,null]
};

let stream = null;
let croppedDataUrl = null;

// ── Camera ───────────────────────────────────────────────────────
async function openCamera() {
  try {
    setStatus('<span class="spinner"></span> Starting camera…');
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode:'environment', width:{ideal:1920}, height:{ideal:1080} }
    });
    const v = document.getElementById('video');
    v.srcObject = stream;
    await new Promise(r => { v.onloadedmetadata = r; });
    v.play();
    document.getElementById('snapBtn').disabled  = false;
    document.getElementById('openBtn').disabled  = true;
    setStatus('Fit the VIN number inside the strip, then tap Snap');
  } catch(e) {
    setStatus('No camera — upload a photo or type manually');
  }
}

function snap() {
  const video      = document.getElementById('video');
  const viewfinder = document.getElementById('viewfinder');
  const canvas     = document.getElementById('canvas');

  // 1. Draw full video frame onto canvas
  const vw = video.videoWidth;
  const vh = video.videoHeight;
  canvas.width  = vw;
  canvas.height = vh;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(video, 0, 0, vw, vh);

  // 2. Calculate which part of the video is visible inside the viewfinder strip.
  //    The video has: object-fit:cover + CSS scale(2).
  //
  //    Step A — object-fit:cover: find the rendered size of the video inside the strip.
  const sfW = viewfinder.clientWidth;
  const sfH = viewfinder.clientHeight;           // 70 px

  const coverScale = Math.max(sfW / vw, sfH / vh);
  // visible area of the video (in video pixels) that maps onto the strip:
  const covW = sfW / coverScale;   // video pixels wide that are visible (before zoom)
  const covH = sfH / coverScale;   // video pixels tall
  const covX = (vw - covW) / 2;
  const covY = (vh - covH) / 2;

  //    Step B — CSS scale(2) zooms the rendered video by 2× around its center,
  //    so only the MIDDLE HALF of the already-covered region is actually visible.
  const zoomFactor = 2;
  const zW = covW / zoomFactor;
  const zH = covH / zoomFactor;
  const zX = covX + (covW - zW) / 2;
  const zY = covY + (covH - zH) / 2;

  // 3. Crop ONLY that region and scale up 5× for OCR
  const SCALE = 5;
  const crop = document.createElement('canvas');
  crop.width  = Math.round(zW * SCALE);
  crop.height = Math.round(zH * SCALE);
  crop.getContext('2d').drawImage(canvas, zX, zY, zW, zH, 0, 0, crop.width, crop.height);

  croppedDataUrl = crop.toDataURL('image/png');

  stopCamera();
  showPreview(croppedDataUrl);
}

function stopCamera() {
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  document.getElementById('viewfinder').style.display = 'none';
  document.getElementById('vfLabel').style.display    = 'none';
  document.getElementById('camRow').style.display     = 'none';
}

function showPreview(url) {
  const img = document.getElementById('preview');
  img.src = url;
  img.style.display = 'block';
  document.getElementById('retakeRow').classList.add('show');
  setStatus('This is what the scanner sees — tap Read VIN');
}

function retake() {
  croppedDataUrl = null;
  document.getElementById('preview').style.display     = 'none';
  document.getElementById('retakeRow').classList.remove('show');
  document.getElementById('resultCard').classList.remove('show');
  document.getElementById('viewfinder').style.display  = 'block';
  document.getElementById('vfLabel').style.display     = 'block';
  document.getElementById('camRow').style.display      = 'flex';
  document.getElementById('openBtn').disabled = false;
  document.getElementById('snapBtn').disabled = true;
  setStatus('');
  openCamera();
}

// ── Upload: crop middle 20% height strip ─────────────────────────
function fromFile(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async ev => {
    const img = new Image();
    img.src = ev.target.result;
    await new Promise(r => img.onload = r);

    // Crop: full width, middle 20% height, scaled 4×
    const cw = img.width;
    const ch = Math.round(img.height * 0.20);
    const cy = Math.round((img.height - ch) / 2);

    const SCALE = 4;
    const c = document.createElement('canvas');
    c.width  = cw * SCALE;
    c.height = ch * SCALE;
    c.getContext('2d').drawImage(img, 0, cy, cw, ch, 0, 0, c.width, c.height);

    croppedDataUrl = c.toDataURL('image/png');
    stopCamera();
    showPreview(croppedDataUrl);
  };
  reader.readAsDataURL(file);
}

// ── OCR ──────────────────────────────────────────────────────────
async function readVIN() {
  if (!croppedDataUrl) return;
  setStatus('<span class="spinner"></span> Loading OCR engine…');
  showCard('<span class="spinner"></span> Scanning strip…', true);

  try {
    // Load the cropped strip and convert to high-contrast B&W
    const img = new Image();
    img.src = croppedDataUrl;
    await new Promise(r => img.onload = r);

    const c   = document.createElement('canvas');
    c.width   = img.width;
    c.height  = img.height;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, c.width, c.height);
    ctx.drawImage(img, 0, 0);

    const id = ctx.getImageData(0, 0, c.width, c.height);
    const d  = id.data;
    for (let i = 0; i < d.length; i += 4) {
      const lum = 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];
      const v   = lum > 145 ? 255 : 0;
      d[i] = d[i+1] = d[i+2] = v; d[i+3] = 255;
    }
    ctx.putImageData(id, 0, 0);

    setStatus('<span class="spinner"></span> Running OCR…');

    const result = await Tesseract.recognize(c.toDataURL('image/png'), 'eng', {
      tessedit_char_whitelist: 'ABCDEFGHJKLMNPRSTUVWXYZ0123456789',
      tessedit_pageseg_mode: '7',   // single text line
    });

    // Clean output: only valid VIN characters
    const raw = result.data.text.toUpperCase().replace(/[^A-HJ-NPR-Z0-9]/g, '');
    setStatus('');

    // Try to find a 17-char VIN
    const match = raw.match(/[A-HJ-NPR-Z0-9]{17}/);
    const vin   = match ? match[0] : (raw.length >= 10 ? raw : null);

    if (vin) {
      renderResult(vin, raw);
    } else {
      showCard(`
        <div class="err">⚠️ Δεν διαβάστηκε VIN.<br>
        OCR είδε: <span style="font-family:'DM Mono',monospace;font-size:.75rem;color:var(--muted)">"${raw||'—'}"</span></div>
        <div class="note">Βεβαιώσου ότι το VIN γεμίζει τη λωρίδα και υπάρχει καλός φωτισμός. Ή γράψε το παρακάτω.</div>
      `, false);
    }
  } catch(err) {
    setStatus('');
    showCard(`<div class="err">⚠️ Σφάλμα: ${err.message}</div>`, false);
  }
}

// ── Render result ────────────────────────────────────────────────
function renderResult(vin, raw) {
  const ch    = vin[9];
  const entry = YEARS[ch];

  const vinHtml = vin.length >= 10
    ? vin.slice(0,9) + `<span class="hl">${vin[9]}</span>` + vin.slice(10)
    : vin;

  let yearsHtml = '';
  if (entry) {
    const [y1, y2] = entry;
    yearsHtml = `
      <div class="year-box">
        <div><div class="year-sub">MODEL YEAR</div><div class="year-num">${y1}</div></div>
        <span style="font-size:2rem;opacity:.5">🚗</span>
      </div>
      ${y2 ? `
      <div class="year-box">
        <div><div class="year-sub">Ή MODEL YEAR</div><div class="year-num">${y2}</div></div>
        <span style="font-size:2rem;opacity:.5">🚘</span>
      </div>
      <div class="note">ℹ️ Ο κωδικός επαναλαμβάνεται κάθε 30 χρόνια.</div>` : ''}`;
  } else {
    yearsHtml = `<div class="err">Άγνωστος κωδικός "${ch}".</div>`;
  }

  showCard(`
    <div class="big-char">
      <div class="char">${ch}</div>
      <div class="char-info"><strong>10ος χαρακτήρας VIN</strong>Κωδικός έτους κατασκευής</div>
    </div>
    ${yearsHtml}
    <div class="vin-strip">VIN: ${vinHtml}</div>
    ${raw && raw !== vin ? `<div class="note">OCR: ${raw}</div>` : ''}
  `, false);
}

function manualDecode() {
  const v = document.getElementById('manualInput').value.trim().toUpperCase();
  if (v.length < 10) { setStatus('Χρειάζονται τουλάχιστον 10 χαρακτήρες'); return; }
  setStatus('');
  renderResult(v, null);
}

function showCard(html, loading) {
  const card = document.getElementById('resultCard');
  document.getElementById('resultBody').innerHTML = html;
  card.classList.add('show');
  card.style.opacity = loading ? '.6' : '1';
}

function setStatus(html) { document.getElementById('status').innerHTML = html; }

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('manualInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') manualDecode();
  });
});
</script>
</body>
</html>
